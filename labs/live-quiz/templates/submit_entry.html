{% extends "base.html" %}
{% block title %}Submit your work — KOSEN·KMITL{% endblock %}
{% block main %}
<div class="lx-ground">
  <div class="lx-wrap">
    <form class="lx-form" method="post" action="/submit"> <!-- nosemgrep: python.django.security.django-no-csrf-token.django-no-csrf-token -->
      <p class="lx-eyebrow">Submit your work</p>
      <h1 class="lx-h1">Enter your code</h1>
      <p class="lx-lead">Use the submission code on your slip. You can come back with the
        same code until the deadline.</p>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      {% if error %}<div class="lx-err">{{ error }}</div>{% endif %}
      <div class="lx-field"><label class="lx-label" for="code">Submission code</label>
        <input class="lx-input" id="code" name="code" autocomplete="off" autocapitalize="characters"
               spellcheck="false" maxlength="16" required></div>
      <button class="lx-btn" type="submit">Open ▸</button>
    </form>
  </div>
</div>
{% endblock %}
