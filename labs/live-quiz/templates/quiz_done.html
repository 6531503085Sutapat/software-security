<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Done — KOSEN·KMITL</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="pwrap"><section class="pjoin">
  <div class="mark"><div class="word"><span class="k">KOSEN</span><span class="dot">·</span><span class="m">KMITL</span></div></div>
  <div class="join-card">
    <h1>{{ message }}</h1>
    {% if score %}
      <p class="lead">{{ '%.1f'|format(score[0]) }} / {{ '%.1f'|format(score[1]) }}
        {%- if not score[2] %} (short answer not marked yet){% endif %}</p>
    {% else %}
      <p class="lead">Your score will be released by your instructor.</p>
    {% endif %}
  </div></section></div></body></html>
