name: security-ci

on:
  push:
  pull_request:

jobs:
  sast:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy target to a path semgrepignore won't match
        run: |
          rm -rf sast-scan-target
          cp -r labs/week02-sdlc-tooling/vulnerable-repo sast-scan-target
      - name: Run Semgrep
        uses: docker://semgrep/semgrep:latest
        with:
          args: semgrep --config p/default --config p/owasp-top-ten --error --no-git-ignore sast-scan-target

  secrets:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: docker://zricethezav/gitleaks:latest
        with:
          args: detect --no-git -s labs/week02-sdlc-tooling/vulnerable-repo -v

  sca:
    name: Trivy (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: docker://aquasec/trivy:latest
        with:
          args: fs --exit-code 1 --severity HIGH,CRITICAL project/starter-app